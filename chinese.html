            background-position: center;
            transition: background-image 1s ease-in-out;
        }

        .visual-side {
            position: absolute;
            top: 0;
            left: 0;
            width: 65%; /* 占据左侧大部分空间显示立绘 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            overflow: hidden;
            transition: all 1s ease;
        }

        .character-img {
            height: 95vh; /* 进一步提升高度 */
            max-height: 1000px;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.9));
            position: relative !important;
            margin: 0 -80px;
        }

        .content-side {
            position: absolute;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            width: 380px; /* 侧边窄对话框，完全不遮挡人物 */
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 40px;
            background: rgba(25, 25, 25, 0.85);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border-radius: 8px;
            background-image: url('https://www.transparenttextures.com/patterns/rocky-wall.png');
        }

        @media (max-width: 1200px) {
            .visual-side { width: 100%; }
            .content-side { 
                width: 350px; 
                right: 20px;
                background: rgba(20, 20, 20, 0.9);
            }
        }

        @media (max-width: 768px) {
            .visual-side { height: 60vh; }
            .content-side {
                position: relative;
                top: 0;
                right: 0;
                transform: none;
                width: calc(100% - 40px);
                margin: 20px;
                padding: 20px;
            }
            .character-img { height: 55vh; }
        }

        .ending-screen {
            border: 15px solid var(--accent-gold);
            border-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png') 30 round;
            box-sizing: border-box;
        }

        .ending-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            color: var(--accent-gold);
            text-shadow: 0 0 20px var(--primary);
            z-index: 20;
            letter-spacing: 15px;
            opacity: 0;
            pointer-events: none;
        }

        .ending-glow {
            filter: drop-shadow(0 0 60px rgba(212, 175, 55, 0.8)) brightness(1.2) contrast(1.1) !important;
            transform: scale(1.05);
        }

        .speaker-name {
            color: var(--accent-gold);
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 6px solid var(--primary);
            padding-left: 15px;
            letter-spacing: 2px;
        }

        .psychology-note {
            font-style: italic;
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 4px;
        }

        .dialogue-text {
            font-size: 1.4rem; /* 适配课堂远距离观看 */
            line-height: 1.8;
            margin-bottom: 40px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .option-btn {
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid var(--accent-gold);
            color: var(--text-light);
            padding: 15px 25px;
            text-align: left;
            cursor: pointer;
            transition: all 0.4s;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
        }

        .option-btn:hover {
            background: var(--primary);
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.6);
        }

        .analysis-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-width: 90%;
            background: #f4f3ec; /* 宣纸色 */
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            border: 10px double var(--primary);
            padding: 45px;
            font-size: 1.25rem;
            border-radius: 2px;
            display: none;
            z-index: 2000;
            box-shadow: 0 0 0 100vmax rgba(0,0,0,0.8), 0 30px 70px rgba(0,0,0,0.6);
            color: #1a1a1a;
        }

        .analysis-title {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--primary);
            padding-bottom: 10px;
        }

        .analysis-close-btn {
            display: block;
            margin: 25px auto 0;
            padding: 10px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }

        .analysis-close-btn:hover {
            background: #a00;
            transform: scale(1.05);
        }

        .analysis-highlight {
            color: var(--primary);
            font-weight: bold;
            border-bottom: 2px solid var(--primary);
            padding: 0 2px;
        }

        .curtain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            background-image: url('https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/o7sMtPLL2h9arQp2PHTmvD.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .curtain-inner {
            background: rgba(20, 20, 20, 0.8);
            padding: 60px;
            border-radius: 4px;
            border: 2px solid var(--accent-gold);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(212, 175, 55, 0.2);
            max-width: 800px;
            position: relative;
            background-image: url('https://www.transparenttextures.com/patterns/rocky-wall.png'); /* 岩彩肌理感 */
        }

        .curtain-inner::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
        }

        .analysis-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
            transition: all 0.3s;
            z-index: 15;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }

        .analysis-trigger:hover {
            background: var(--accent-gold);
            color: #000;
            transform: scale(1.05);
        }

        .start-btn {
            padding: 20px 60px;
            background: var(--primary);
            color: white;
            border: 2px solid var(--accent-gold);
            font-size: 1.8rem;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 8px;
            transition: 0.5s;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
            border-radius: 50px;
        }

        .start-btn:hover {
            letter-spacing: 12px;
            background: #a00;
            transform: scale(1.1);
        }

        .history-back {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 20px;
            cursor: pointer;
            z-index: 100;
            border-radius: 30px;
            font-size: 0.9rem;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }
    &lt;/style&gt;

&lt;script&gt;
    const assets = {

    };

    const story = {
        start: {
            speaker: &quot;旁白&quot;,
            text: &quot;楚州大旱，高利贷逼债。你魂穿成了窦娥，此时父亲窦天章正满面愁容地看着你。他欲进京赶考，却欠下蔡婆婆羊羔儿利，无力偿还，准备将你卖入蔡家做童养媳。&quot;,
            psychology: &quot;（你感到一阵寒意，这是命运的起点，也是悲剧的开端。）&quot;,
            leftChar: assets.doutianzhang,
            rightChar: assets.doue,
            background: assets.bg_street,
            options: [
                { text: &quot;A. 顺从父命，入蔡府做童养媳。（隐忍求全）&quot;, next: &quot;act1_a&quot; },
                { text: &quot;B. 坚决反抗，宁可随父乞讨也不被卖。（试图挣脱）&quot;, next: &quot;act1_b&quot; }

        act1_a: {
            speaker: &quot;窦娥&quot;,
            text: &quot;爹爹，孩儿明白您的难处。既然债台高筑，孩儿愿入蔡府，只求爹爹此去金榜题名。&quot;,

            leftChar: assets.doutianzhang,
            rightChar: assets.doue,
            background: assets.bg_street,
            analysis: &quot;社会根源：元代&lt;span class='analysis-highlight'&gt;高利贷剥削（羊羔儿利）&lt;/span&gt;横行，底层知识分子无力偿还，只能牺牲子女。这是&lt;span class='analysis-highlight'&gt;经济压迫&lt;/span&gt;的必然。&quot;,
            options: [{ text: &quot;时光荏苒，进入下一幕：讨债&quot;, next: &quot;act2&quot; }]
        },
        act1_b: {
            speaker: &quot;窦天章&quot;,
            text: &quot;唉，我儿随我受苦了。我们父女进京，总有一条活路！&quot;,
            psychology: &quot;（你以为逃离了蔡家，却不知元代户籍制度严苛，流民生存空间极小。）&quot;,
            leftChar: assets.doutianzhang,
            rightChar: assets.doue,
            background: assets.bg_street,
            isEnding: true,
            analysis: &quot;悲剧必然：窦天章最终因欠债被投入大狱，你流落街头。元代&lt;span class='analysis-highlight'&gt;户籍制度严苛&lt;/span&gt;，流民生存空间极小。逃亡虽能避一时之债，却难逃&lt;span class='analysis-highlight'&gt;法网与饥荒&lt;/span&gt;。&quot;,
            options: [{ text: &quot;命运弄人，重新抉择&quot;, next: &quot;start&quot; }]
        },
        act2: {
            speaker: &quot;蔡婆婆&quot;,
            text: &quot;窦娥啊，那赛卢医欠我不少银子，我今日打算去城南荒僻处寻他讨要。你在家守着。&quot;,
            psychology: &quot;（你心中一惊，原著中蔡婆婆此行险些丧命，引狼入室。）&quot;,
            leftChar: assets.caipo,
            rightChar: assets.doue,
            background: assets.bg_house,
            options: [
                { text: &quot;A. 劝阻蔡婆，避免冲突&quot;, next: &quot;act2_a&quot; },
                { text: &quot;B. 顺从婆婆，任其前往&quot;, next: &quot;act2_b&quot; }
            ]
        },
        act2_a: {
            speaker: &quot;旁白&quot;,
            text: &quot;蔡婆虽暂时避开了赛卢医，但高利贷的盘剥如影随形。赛卢医为消灭债务竟铤而走险，蔡婆最终未能幸免。婆婆死后，孤身一人的你，更失去了唯一的依靠。&quot;,
            psychology: &quot;（躲得过初一，躲不过十五。在这个法治缺失的时代，弱者是无法通过避让获得安全的。）&quot;,
            leftChar: null,
            rightChar: assets.doue,
            background: assets.bg_house,
            isEnding: true,
            analysis: &quot;社会根源：元代社会动荡，高利贷剥削严重。蔡婆婆作为孤孀，缺乏社会保护。悲剧的阴影已将你彻底笼罩。&quot;,
            options: [{ text: &quot;命运的死胡同，重新抉择&quot;, next: &quot;act2&quot; }]
        },
        act2_b: {
            speaker: &quot;旁白&quot;,
            text: &quot;蔡婆在讨债途中遭遇险境，幸被张驴儿父子所救。然而，这救命之恩却成了勒索的筹码。张驴儿父子闯入蔡家，威逼利诱，要蔡婆婆和窦娥改嫁。&quot;,
            psychology: &quot;（张驴儿那贪婪的目光让你作呕，真正的噩梦开始了。）&quot;,
            leftChar: assets.zhanglv,
            rightChar: assets.doue,
            background: assets.bg_house,
            options: [
                { text: &quot;A. 宁死不嫁，坚决不从&quot;, next: &quot;act3_a&quot; },
                { text: &quot;B. 被迫妥协，答应嫁给张驴儿&quot;, next: &quot;act3_b&quot; }
            ]
        },
        act3_a: {
            speaker: &quot;张驴儿&quot;,
            text: &quot;好个小娘子，竟敢不从！你等着，我有的是办法让你求生不得，求死不能！&quot;,
            psychology: &quot;（你守住了清白，却激怒了毒蛇。张驴儿欲毒死蔡婆，却误杀亲父，反诬告你。）&quot;,
            leftChar: assets.zhanglv,
            rightChar: assets.doue,
            background: assets.bg_house,
            options: [{ text: &quot;公堂对质&quot;, next: &quot;act4&quot; }]
        },
        act3_b: {
            speaker: &quot;旁白&quot;,
            text: &quot;你暂时保住了性命，但这只是噩梦的开始。驴儿父子霸占了家产，你在封建伦理的唾弃中，在无尽的纠葛与屈辱中度过余生。&quot;,
            psychology: &quot;（苟活是以丧失人格尊严为代价的。在关汉卿的价值观里，这种对人格尊严的践踏是比死亡更深重的悲剧。）&quot;,
            leftChar: assets.zhanglv,
            rightChar: assets.doue,
            background: assets.bg_house,
            isEnding: true,
            analysis: &quot;社会根源：即便顺从，在法治缺失的社会，流氓的贪欲永无止境。妥协并不能换来和平，只会让压迫合法化。&quot;,
            options: [{ text: &quot;生不如死，重新抉择&quot;, next: &quot;act2_b&quot; }]
        },
        act4: {
            speaker: &quot;桃杌&quot;,
            text: &quot;大胆窦娥！竟敢下毒杀害公公！来人，给我严刑拷打！&quot;,
            psychology: &quot;（堂上坐着的是贪官桃杌，他只看金银，不问是非。这是你最后的抉择。）&quot;,
            leftChar: assets.taowu,
            rightChar: assets.doue,
            background: assets.bg_court,
            options: [
                { text: &quot;1. 坚决不认罪，不贿赂&quot;, next: &quot;end_justice&quot; },
                { text: &quot;2. 贿赂官员，想求活路&quot;, next: &quot;end_bribe&quot; }
            ]
        },
        end_justice: {
            speaker: &quot;窦娥&quot;,
            text: &quot;我窦娥委实冤枉！若我死后，血溅白练，六月飞雪，大旱三年，方显我冤情！&quot;,
            psychology: &quot;（你选择了不屈，用生命发出了最后的控诉。三桩誓愿，是浪漫主义的抗争。）&quot;,
            leftChar: null,
            rightChar: assets.doue,
            background: assets.bg_court,
            isEnding: true,
            analysis: &quot;社会根源：窦娥的悲剧并非偶然。从高利贷剥削到地痞横行，再到司法腐败，重重枷锁将她推向绝路。这是对现实黑暗的极度控诉。&quot;,
            options: [{ text: &quot;查看最终结局&quot;, next: &quot;final&quot; }]
        },
        end_bribe: {
            speaker: &quot;旁白&quot;,
            text: &quot;你哀求蔡婆通过钱财来寻求桃杌通融，虽免于一死，但张驴儿仍继续纠缠，贪官反复索取，蔡家最终倾家荡产，你沦为乞丐，婆婆也因病去世。&quot;,
            psychology: &quot;（金钱在权力面前同样脆弱。贿赂只能延缓悲剧，却无法消除产生罪恶的土壤。）&quot;,
            leftChar: assets.taowu,
            rightChar: assets.doue,
            background: assets.bg_court,
            isEnding: true,
            analysis: &quot;社会根源：元代司法的贪婪是无底洞。地痞流氓与官府勾结，底层女性缺乏法律保护。&quot;,
            options: [{ text: &quot;查看最终结局&quot;, next: &quot;final&quot; }]
        },
        final: {
            speaker: &quot;总结&quot;,
            text: &quot;你走完了所有分支。每条路的尽头都是死亡、屈辱或无声的湮灭。无论你如何选择，窦娥都无法逃脱那个时代对一个底层女子的围剿。&quot;,
            psychology: &quot;（《窦娥冤》的悲剧，从来不是因为某一个选择错了，而是整个黑暗时代、不公社会造成的必然悲剧。）&quot;,
            leftChar: null,
            rightChar: null,
            background: assets.bg_main,
            isEnding: true,
            analysis: &quot;核心主旨：关汉卿通过窦娥的抗争，揭示了元代社会&lt;span class='analysis-highlight'&gt;官匪勾结、司法黑暗&lt;/span&gt;的本质。悲剧的根源在于&lt;span class='analysis-highlight'&gt;封建专制制度&lt;/span&gt;对人性的摧残。&quot;,
            options: [{ text: &quot;重新体验&quot;, next: &quot;start&quot; }]
        }
    };

    let currentStep = 'start';
    let history = [];

    function startGame() {
        anime({
            targets: '#curtain',
            opacity: 0,
            duration: 1000,
            easing: 'easeInOutQuad',
            complete: () =&gt; {
                document.getElementById('curtain').style.display = 'none';
                renderStep('start');
            }
        });
    }

    function closeAnalysis() {
        anime({
            targets: '#analysis',
            scale: [1, 0.8],
            opacity: [1, 0],
            duration: 400,
            easing: 'easeInBack',
            complete: () =&gt; {
                document.getElementById('analysis').style.display = 'none';
            }
        });
    }

    function showAnalysis() {
        const step = story[currentStep];
        if (step.analysis) {
            const analysisEl = document.getElementById('analysis');
            analysisEl.style.display = 'block';
            document.getElementById('analysis-content').innerHTML = step.analysis;
            anime({
                targets: '#analysis',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 600,
                easing: 'easeOutBack'
            });
        }
    }

    function renderStep(stepKey) {
        const step = story[stepKey];
        currentStep = stepKey;

        // 隐藏分析按钮和移除结局特效
        document.getElementById('analysis-btn').style.display = 'none';
        document.getElementById('ending-title').style.opacity = '0';
        document.querySelector('.game-container').classList.remove('ending-screen');
        document.querySelectorAll('.character-img').forEach(c =&gt; c.classList.remove('ending-glow'));

        // 更新背景
        if (step.background) {
            document.querySelector('.game-container').style.backgroundImage = `url('${step.background}')`;
        }

        // 更新人物
        updateCharacter('char-left', step.leftChar);
        updateCharacter('char-right', step.rightChar);

        // 布局调整：单人独白时居中
        const visualSide = document.querySelector('.visual-side');
        if (step.leftChar &amp;&amp; step.rightChar) {
            visualSide.style.justifyContent = 'space-around';
        } else {
            visualSide.style.justifyContent = 'center';
        }

        // 更新文本
        document.getElementById('speaker').innerText = step.speaker;
        document.getElementById('psychology').innerText = step.psychology || &quot;&quot;;
        
        // 打字机效果
        const textEl = document.getElementById('text');
        textEl.innerText = &quot;&quot;;
        let i = 0;
        const typeWriter = () =&gt; {
            if (i &lt; step.text.length) {
                textEl.innerText += step.text.charAt(i);
                i++;
                setTimeout(typeWriter, 30);
            } else {
                // 文本打完后
                if (step.isEnding) {
                    // 结局特殊处理：人物发光并自动弹出分析
                    const chars = document.querySelectorAll('.character-img');
                    chars.forEach(c =&gt; c.classList.add('ending-glow'));
                    document.querySelector('.game-container').classList.add('ending-screen');
                    
                    anime({
                        targets: '#ending-title',
                        opacity: [0, 1],
                        translateY: [-20, 0],
                        duration: 1000,
                        easing: 'easeOutExpo'
                    });

                    setTimeout(showAnalysis, 1200);
                } else if (step.analysis) {
                    // 非结局显示分析按钮
                    const btn = document.getElementById('analysis-btn');
                    btn.style.display = 'block';
                    anime({
                        targets: '#analysis-btn',
                        opacity: [0, 1],
                        translateY: [10, 0],
                        duration: 500,
                        easing: 'easeOutQuad'
                    });
                }
            }
        };
        typeWriter();

        // 更新选项
        const optionsEl = document.getElementById('options');
        optionsEl.innerHTML = &quot;&quot;;
        step.options.forEach(opt =&gt; {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () =&gt; {
                history.push(currentStep);
                renderStep(opt.next);
            };
            optionsEl.appendChild(btn);
        });
    }

    function updateCharacter(id, src) {
        const img = document.getElementById(id);
        const isMobile = window.innerWidth &lt;= 768;
        if (src) {
            img.src = src;
            img.style.display = 'block';
            anime({
                targets: img,
                opacity: 1,
                translateX: isMobile ? 0 : (id === 'char-left' ? [-100, 0] : [100, 0]),
                translateY: isMobile ? [20, 0] : 0,
                duration: 1000,
                easing: 'easeOutExpo'
            });
        } else {
            anime({
                targets: img,
                opacity: 0,
                duration: 500,
                complete: () =&gt; { img.style.display = 'none'; }
            });
        }
    }

    function goBack() {
        if (history.length &gt; 0) {
            const lastStep = history.pop();
            renderStep(lastStep);
        }
    }
&lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击飞象老师 Logo 的埋点
     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
